name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Apply Approved Project Icon To Android
        run: |
          # البحث عن صورة الأيقونة المعتمدة داخل مجلدات المشروع
          ICON_SRC=""
          for f in public/pwa-512x512.png public/app-icon.png public/pwa-192x192.png public/apple-touch-icon.png assets/icon.png; do
            if [ -f "$f" ]; then
              ICON_SRC="$f"
              break
            fi
          done

          if [ -n "$ICON_SRC" ]; then
            echo "Using approved project icon: $ICON_SRC"
            # استبدال جميع أيقونات أندرويد بالصورة المعتمدة
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
            
            # إزالة تعريفات الأيقونة الافتراضية التي تعرض شعار Capacitor
            rm -rf android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml || true
            rm -rf android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml || true
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
