name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Force Project App Icon
        run: |
          # تحديد صورة الأيقونة من مجلد public
          ICON_SRC=""
          if [ -f "public/app-icon.png" ]; then
            ICON_SRC="public/app-icon.png"
          elif [ -f "public/pwa-512x512.png" ]; then
            ICON_SRC="public/pwa-512x512.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            echo "Applying app icon from $ICON_SRC"
            
            # 1. حذف مجلد mipmap-anydpi-v26 بالكامل لإلغاء أيقونة أندرويد الخضراء التكيفية
            rm -rf android/app/src/main/res/mipmap-anydpi-v26

            # 2. استبدال جميع صور الأيقونات في كافة أحجام mipmap بالصورة المعتمدة
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
