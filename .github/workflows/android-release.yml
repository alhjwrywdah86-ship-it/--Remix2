name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure npm network retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Smart Validate and Setup App Icon
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function isValidPng(filePath) {
            try {
              const buf = Buffer.alloc(8);
              const fd = fs.openSync(filePath, "r");
              fs.readSync(fd, buf, 0, 8, 0);
              fs.closeSync(fd);
              return buf.toString("hex") === "89504e470d0a1a0a";
            } catch (e) {
              return false;
            }
          }

          function findValidIcon(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            let bestMatch = null;

            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);
              if (["node_modules", "android", ".git", "dist"].includes(entry.name)) continue;

              if (entry.isDirectory()) {
                const found = findValidIcon(fullPath);
                if (found) return found;
              } else if (entry.isFile()) {
                const lower = entry.name.toLowerCase();
                if (lower.includes("app-icon-512") && isValidPng(fullPath)) {
                  return fullPath; // Priority 1: Exact target icon
                }
                if (lower.includes("icon") && isValidPng(fullPath)) {
                  bestMatch = fullPath;
                }
              }
            }
            return bestMatch;
          }

          const iconPath = findValidIcon(".");
          if (!iconPath) {
            console.error("::error::No valid PNG icon found!");
            process.exit(1);
          }

          console.log("Found valid clean icon at:", iconPath);

          fs.mkdirSync("assets", { recursive: true });
          fs.copyFileSync(iconPath, "assets/icon-only.png");
          fs.copyFileSync(iconPath, "assets/icon-foreground.png");
          fs.copyFileSync(iconPath, "assets/icon.png");
          '

      - name: Generate App Icons
        run: npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#021636" --iconBackgroundColorDark "#021636"

      - name: Setup Gradle Wrapper Files
        run: |
          mkdir -p android/gradle/wrapper
          curl -fSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
