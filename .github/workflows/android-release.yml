name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Force Apply Golden Hat App Icon to Android
        run: |
          python3 -m pip install pillow
          python3 - << 'EOF'
          import os, glob
          from PIL import Image

          # البحث عن صورة القبعة الذهبية في المجلدات المتاحة
          search_paths = [
              'src/assets/images/app_icon_official_*.jpg',
              'src/assets/images/app_icon_official_*.png',
              'public/og-image.png',
              'src/assets/images/og_image_*.jpg'
          ]

          candidate_files = []
          for pattern in search_paths:
              candidate_files.extend(glob.glob(pattern))

          valid_img = None
          selected_path = None

          for path in candidate_files:
              if os.path.exists(path):
                  try:
                      img = Image.open(path)
                      img.verify()
                      valid_img = Image.open(path).convert('RGBA')
                      selected_path = path
                      print(f"Successfully loaded source icon: {path}")
                      break
                  except Exception as e:
                      print(f"Skipping unusable file {path}: {e}")

          if not valid_img:
              print("Error: No Golden Hat icon source image found.")
              exit(1)

          # قص مركز الصورة لضمان ملاءمتها لكافة أحجام الأيقونات
          w, h = valid_img.size
          crop_size = min(w, h)
          left = (w - crop_size) // 2
          top = (h - crop_size) // 2
          cropped_img = valid_img.crop((left, top, left + crop_size, top + crop_size))

          res_dir = 'android/app/src/main/res'

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          fg_sizes = {
              'mipmap-mdpi': 108,
              'mipmap-hdpi': 162,
              'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324,
              'mipmap-xxxhdpi': 432
          }

          for folder, size in sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = cropped_img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher.png'))
              resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))

          for folder, size in fg_sizes.items():
              target_dir = os.path.join(res_dir, folder)
              os.makedirs(target_dir, exist_ok=True)
              resized = cropped_img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))

          print(f"Successfully generated Android Launcher Icons using {selected_path}!")
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Gradle Wrapper (Download Clean Binary 8.13)
        run: |
          mkdir -p android/gradle/wrapper
          curl -fSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
