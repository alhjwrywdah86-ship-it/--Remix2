name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure npm network retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Force Direct Icon Replacement
        run: |
          FOUND_ICON=""
          for f in "app-icon-512.png" "public/app-icon-512.png" "assets/app-icon-512.png"; do
            if [ -f "$f" ]; then
              FOUND_ICON="$f"
              break
            fi
          done

          if [ -z "$FOUND_ICON" ]; then
            FOUND_ICON=$(find . -not -path "*/android*" -iname "*app-icon-512*.png" -o -not -path "*/android*" -iname "*app-icon*.png" | head -n 1)
          fi

          if [ -z "$FOUND_ICON" ]; then
            echo "::error::Could not find a valid source icon file!"
            exit 1
          fi

          echo "Found clean source icon at: $FOUND_ICON"

          sudo apt-get update && sudo apt-get install -y imagemagick

          RES_DIR="android/app/src/main/res"
          mkdir -p $RES_DIR/mipmap-mdpi $RES_DIR/mipmap-hdpi $RES_DIR/mipmap-xhdpi $RES_DIR/mipmap-xxhdpi $RES_DIR/mipmap-xxxhdpi

          # Replace all legacy and round icons
          convert "$FOUND_ICON" -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert "$FOUND_ICON" -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert "$FOUND_ICON" -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert "$FOUND_ICON" -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert "$FOUND_ICON" -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png

          convert "$FOUND_ICON" -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          convert "$FOUND_ICON" -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          convert "$FOUND_ICON" -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          convert "$FOUND_ICON" -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          convert "$FOUND_ICON" -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png

          convert "$FOUND_ICON" -resize 108x108 $RES_DIR/mipmap-mdpi/ic_launcher_foreground.png
          convert "$FOUND_ICON" -resize 162x162 $RES_DIR/mipmap-hdpi/ic_launcher_foreground.png
          convert "$FOUND_ICON" -resize 216x216 $RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png
          convert "$FOUND_ICON" -resize 324x324 $RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png
          convert "$FOUND_ICON" -resize 432x432 $RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png

          # Delete XML vector icon overrides to force PNG icon usage
          find $RES_DIR -name "ic_launcher.xml" -delete || true
          find $RES_DIR -name "ic_launcher_round.xml" -delete || true

      - name: Setup Gradle Wrapper Files
        run: |
          mkdir -p android/gradle/wrapper
          curl -fSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
