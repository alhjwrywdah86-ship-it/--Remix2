name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure npm network retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Smart Validate and Setup App Icon
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function getFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              if (["node_modules", "android", ".git", "dist", "build"].includes(file)) return;
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat && stat.isDirectory()) {
                results = results.concat(getFiles(fullPath));
              } else {
                results.push({ path: fullPath, size: stat.size });
              }
            });
            return results;
          }

          console.log("Searching repository for image files...");
          const allFiles = getFiles(".");
          
          const imageFiles = allFiles.filter(f => {
            const ext = path.extname(f.path).toLowerCase();
            return (ext === ".png" || ext === ".jpg" || ext === ".jpeg" || ext === ".webp") && f.size > 1000;
          });

          console.log("Image files found (>1KB):", imageFiles.map(i => `${i.path} (${i.size}B)`));

          imageFiles.sort((a, b) => {
            const nameA = path.basename(a.path).toLowerCase();
            const nameB = path.basename(b.path).toLowerCase();
            if (nameA.includes("512") && !nameB.includes("512")) return -1;
            if (!nameA.includes("512") && nameB.includes("512")) return 1;
            if (nameA.includes("app-icon") && !nameB.includes("app-icon")) return -1;
            if (!nameA.includes("app-icon") && nameB.includes("app-icon")) return 1;
            if (nameA.includes("icon") && !nameB.includes("icon")) return -1;
            if (!nameA.includes("icon") && nameB.includes("icon")) return 1;
            return b.size - a.size;
          });

          fs.mkdirSync("assets", { recursive: true });

          let selectedPath = null;
          if (imageFiles.length > 0) {
            selectedPath = imageFiles[0].path;
            console.log("Selected best icon source:", selectedPath);
            fs.copyFileSync(selectedPath, "assets/icon.png");
            fs.copyFileSync(selectedPath, "assets/icon-only.png");
            fs.copyFileSync(selectedPath, "assets/icon-foreground.png");
          } else {
            console.log("No custom image found. Creating fallback clean PNG icon...");
            const fallbackHex = "89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789c63000100000500010d0a2db40000000049454e44ae426082";
            const buffer = Buffer.from(fallbackHex, "hex");
            fs.writeFileSync("assets/icon.png", buffer);
            fs.writeFileSync("assets/icon-only.png", buffer);
            fs.writeFileSync("assets/icon-foreground.png", buffer);
          }
          '

      - name: Generate App Icons
        run: npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#021636" --iconBackgroundColorDark "#021636"

      - name: Setup Gradle Wrapper Files
        run: |
          mkdir -p android/gradle/wrapper
          curl -fSL "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
