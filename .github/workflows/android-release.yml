name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup Capacitor & Android Platform
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "المعلم العربي المحترف" "com.arabteacher.app" --web-dir "dist"
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Official Android Assets
        run: |
          mkdir -p assets
          if [ -f "public/app-icon.png" ]; then
            cp public/app-icon.png assets/icon.png
            cp public/app-icon.png assets/icon-only.png
            cp public/app-icon.png assets/icon-foreground.png
          fi
          npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Repair Gradle Wrapper & Build Android APK
        run: |
          # إنشاء بيئة مؤقتة مع ملف إعدادات أدنى لتوليد Wrapper 8.7
          mkdir -p /tmp/gradle-wrapper-fix
          cd /tmp/gradle-wrapper-fix
          touch settings.gradle
          gradle wrapper --gradle-version 8.7

          # نقل ملفات الـ Wrapper السليمة إلى مجلد أندرويد بالمشروع
          cd $GITHUB_WORKSPACE/android
          mkdir -p gradle/wrapper
          cp -f /tmp/gradle-wrapper-fix/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp -f /tmp/gradle-wrapper-fix/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          cp -f /tmp/gradle-wrapper-fix/gradlew ./
          chmod +x gradlew

          # تشغيل عملية البناء بـ Gradlew المتوافق (8.7)
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
