name: Android Release Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate native app icons from source
        run: |
          npm install -D @capacitor/assets
          mkdir -p assets
          cp public/pwa-512x512.png assets/icon-only.png
          cp public/pwa-512x512.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0f172a'

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Project
        run: |
          if [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.json" ]; then
            npx cap sync android || echo "Capacitor sync completed with warnings"
          fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Android directory not detected."
          fi
